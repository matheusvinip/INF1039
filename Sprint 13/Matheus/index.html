<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dúvidas</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <button class="icon-btn back-btn">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <span class="icon-bg">
            <span class="material-symbols-outlined header-icon">robot_2</span>
        </span>
        <h1 class="header-title">Dúvidas Frequentes</h1>
    </header>
    <main class="chat-container">
        <div class="robot-icon-container">
            <span class="material-symbols-outlined main-robot">smart_toy</span>
        </div>
        
        <h2 class="greeting">Olá! Como posso ajudar?</h2>
        <p class="subtitle">Pergunte qualquer dúvida sobre o GradeSync ou organização acadêmica.</p>
        
        <div class="suggestions">
            <button class="suggestion-chip">Como criar uma grade?</button>
            <button class="suggestion-chip">Como editar meu roteiro?</button>
            <button class="suggestion-chip">O que são pré-requisitos?</button>
        </div>
    </main>
    <footer class="input-area">
        <div class="input-wrapper">
            <input type="text" placeholder="Digite sua dúvida...">
            <button class="send-btn">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </footer>
</body>
</html>
